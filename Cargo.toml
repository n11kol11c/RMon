[package]
name = "rmon"
version = "0.1.0"
edition = "2021"
description = "RMon — a cross-platform system monitor for the terminal"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
ratatui = "0.29"
sysinfo = "0.32"

[profile.release]
lto = true
strip = true
codegen-units = 1
